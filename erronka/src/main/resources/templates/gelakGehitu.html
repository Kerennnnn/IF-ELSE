<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/gelakGehitu.js}" defer></script>
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center my-5">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-8">
                <div class="card shadow border-0">
                    <div class="card-body d-flex flex-column p-5">
                        <h2 th:text="${gela.idGela} != null ? 'Gela editatu' : 'Gela berria gehitu'">
                        </h2>
                        <hr>
                        <form th:action="@{/admin/gelak/gehitu}" th:object="${gela}" method="post">
                            <input type="hidden" th:field="*{idGela}">

                            <div class="d-flex flex-column mb-3">
                                <label for="zenbakia" class="form-label">Gelaren zenbakia:</label>
                                <input type="number" th:field="*{gelaZenbakia}" class="form-control" id="zenbakia"
                                    placeholder="Adib: 101">
                                <div class="text-danger" th:if="${#fields.hasErrors('gelaZenbakia')}"
                                    th:errors="*{gelaZenbakia}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="kokapena" class="form-label">Kokapena:</label>
                                <select th:field="*{solairua}" class="form-select">
                                    <option th:each="solairua : ${solairuak}" th:value="${solairua.idSolairua}"
                                        th:text="${solairua.solairuZenbakia}">
                                    </option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('solairua')}"
                                    th:errors="*{solairua}"></div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary"
                                    th:text="${gela.idGela} != null ? 'Gela editatu' : 'Gela gehitu'"></button>
                                <button type="button" class="btn btn-danger" id="btn-ezabatu">Garbitu</button>
                                <a th:href="@{/admin/gelak}" class="btn btn-secondary">Utzi</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
