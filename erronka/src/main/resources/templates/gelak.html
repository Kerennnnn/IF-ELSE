<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/css/gelakStyle.css}">
    <script th:src="@{/js/gelak.js}" defer></script>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container-fluid flex-lg-nowrap">
            <a class="navbar-brand" href="#">If-Else</a>

            <div class="d-flex ms-auto order-lg-3">
                <div class="d-flex gap-3">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="d-flex">
                        <div class="bg-primary text-white p-2 rounded">
                            <i class="fa-regular fa-user me-2"></i><span sec:authentication="principal.username"></span>
                        </div>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-light ms-3"><i
                                    class="fa-solid fa-arrow-right-from-bracket"></i>
                                Irten</button>
                        </form>
                    </div>
                </div>
            </div>


            <div class="collapse navbar-collapse order-lg-2 ms-lg-auto" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Gelen kudeaketa</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/solairuak}">Solairuak</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('USER')">
                        <a class="nav-link" th:href="@{/app/solairuak}">Solairuak</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/eraikinak}">Eraikinak</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('USER')">
                        <a class="nav-link" th:href="@{/app/eraikinak}">Eraikinak</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/gailuak}">Gailu elektronikoak</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('USER')">
                        <a class="nav-link" th:href="@{/app/gailuak}">Gailu elektronikoak</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/erabiltzaileak}">Erabiltzaileak</a>
                    </li>
                </ul>
            </div>



        </div>
    </nav>

    <div class="container mt-5" sec:authorize="hasRole('ADMIN')">
        <div class="d-flex justify-content-end">
            <a th:href="@{/admin/gelak/gehitu}" class="btn btn-primary">+ Gela berria</a>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="card">
                <div class="card-body p-3 row">
                    <div class="col-12">
                        <form class="d-flex" role="search" method="get">
                            <input class="form-control me-2" type="number" placeholder="Bilatu gela zenbakiaz"
                                aria-label="Search" name="search" />
                            <button class="btn btn-primary" type="submit"><i
                                    class="fa-solid fa-magnifying-glass"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container my-5">
        <div class="row align-items-stretch justify-content-center g-4">
            <div th:each="gela:${gelak}" class=" d-flex col-12 col-sm-10 col-md-6 col-xl-4">
                <div class="card h-100 w-100 mi-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div class="d-flex gap-3">
                                <div class="fs-3 bg-primary bg-opacity-10 text-primary py-1 px-2 align-self-center"><i
                                        class="fa-solid fa-desktop"></i>
                                </div>
                                <div th:text="${gela.gelaZenbakia}" class="fs-3"></div>
                            </div>
                            <div class="d-flex gap-2" sec:authorize="hasRole('ADMIN')">
                                <div><a th:href="@{/admin/gelak/gehitu(id=${gela.idGela})}"
                                        class="btn btn-light"><i class="fa-solid fa-pencil"></i></a>
                                </div>
                                <div>
                                    <button class="btn btn-light text-danger bg-danger bg-opacity-10"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalGelaEzabatu_' + ${gela.idGela}">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>

                                    <div class="modal fade" th:id="'modalGelaEzabatu_' + ${gela.idGela}"
                                        tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h1 class="modal-title fs-5">Gela ezabatu</h1>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                        aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body">
                                                    Ziur
                                                    <strong th:text="${gela.gelaZenbakia}"></strong> ezabatu nahi
                                                    duzula?
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                        data-bs-dismiss="modal">Irten</button>
                                                    <form th:action="@{/admin/gelak/delete}" method="post">
                                                        <input type="hidden" name="id" th:value="${gela.idGela}">
                                                        <button type="submit" class="btn btn-primary">Ezabatu</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-column justify-content-center mt-2">
                            <div class="d-flex justify-content-between mt-2">
                                <div>Solairua:</div>
                                <div th:text="${gela.solairua.solairuZenbakia}" class="pe-1"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-2">
        <div>All rights reserved by If-Else&copy;</div>
    </footer>

    <button id="btn-gora" class="btn btn-primary"><i class="fa-solid fa-arrow-up"></i></button>
</body>

</html>
