<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center my-5">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-8">
                <div class="card">
                    <div class="card-body d-flex flex-column p-5">
                        <h2>Gailu berria gehitu:</h2>
                        <hr>
                        <form>
                            <div class="d-flex flex-column mb-3">
                                <label for="izena" class="form-label">Gailuaren izena:</label>
                                <input type="text" class="form-control" id="izena">
                            </div>
                            <div class="dropdown d-flex flex-column mb-3">
                                <label for="izena" class="form-label">Mota:</label>
                                <button class="btn btn-secondary dropdown-toggle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    Aukeratu mota bat
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Smartphone</a></li>
                                    <li><a class="dropdown-item" href="#">Ordenagailua</a></li>
                                    <li><a class="dropdown-item" href="#">Tableta</a></li>
                                    <li><a class="dropdown-item" href="#">Mahaigainekoa</a></li>
                                    <li><a class="dropdown-item" href="#">Erloju adimendua</a></li>
                                    <li><a class="dropdown-item" href="#">Entzungailuak</a></li>
                                    <li><a class="dropdown-item" href="#">Kamera</a></li>
                                    <li><a class="dropdown-item" href="#">Bestelakoak</a></li>
                                </ul>
                            </div>
                            <div class="dropdown d-flex flex-column mb-3">
                                <label for="izena" class="form-label">Egoera:</label>
                                <button class="btn btn-secondary dropdown-toggle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    Aukeratu egoera bat
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Aktiboa</a></li>
                                    <li><a class="dropdown-item" href="#">Konponketan</a></li>
                                    <li><a class="dropdown-item" href="#">Maileguan</a></li>
                                </ul>
                            </div>




                            <div class="mb-3">
                                <label for="marka" class="form-label">Marka:</label>
                                <input type="text" class="form-control" id="marka">
                            </div>
                            <div class="mb-3">
                                <label for="modeloa" class="form-label">Modeloa:</label>
                                <input type="text" class="form-control" id="modeloa">
                            </div>
                            <div class="mb-3">
                                <label for="serieZenb" class="form-label">Serie zenbakia:</label>
                                <input type="text" class="form-control" id="serieZenb">
                            </div>
                            <div class="mb-3">
                                <label for="kokapena" class="form-label">Kokapena:</label>
                                <input type="text" class="form-control" id="kokapena">
                            </div>
                            <div class="mb-3">
                                <label for="erosketaData" class="form-label">Erosketa Data:</label>
                                <input type="date" class="form-control" id="erosketaData">
                            </div>
                            <div class="mb-3">
                                <label for="oharrak" class="form-label">Oharrak:</label>
                                <input type="text" class="form-control" id="oharrak">
                            </div>
                            <div>
                                <button type="submit" class="btn btn-primary">Gailua gehitu</button>
                                <button type="reset" class="btn btn-danger">Gailua ezabatu</button>
                                <button type="reset" class="btn btn-secondary">Utzi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
